version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phh-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phh-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phh-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phh-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phh-frontend
    depends_on:
      - backend
    networks:
      - phh-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: phh-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - phh-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  phh-network:
    driver: bridge
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phh-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phh-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phh-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/phh
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - phh-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phh-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - phh-network

volumes:
  postgres_data:

networks:
  phh-network:
    driver: bridge

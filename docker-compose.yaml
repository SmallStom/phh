version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phh-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phh-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phh-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phh-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - phh-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  phh-network:
    driver: bridge